[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sud-m", email = "smasti@asu.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "isort>=9.0.2",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langchain-unstructured>=1.0.1",
    "langgraph>=1.2.17",
    "pinecone>=6,<8",
    "preshed==3.0.13",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "unstructured>=0.27.34",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"


